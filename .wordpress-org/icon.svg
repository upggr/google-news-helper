<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0783f"/>
      <stop offset="1" stop-color="#d94f18"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- newspaper sheet -->
  <g transform="translate(46,52)">
    <rect x="0" y="0" width="150" height="152" rx="10" fill="#ffffff"/>
    <!-- masthead -->
    <rect x="18" y="20" width="114" height="15" rx="4" fill="#d94f18"/>
    <!-- lead image block -->
    <rect x="18" y="48" width="52" height="42" rx="5" fill="#f5b79b"/>
    <!-- article lines beside image -->
    <rect x="80" y="48"  width="52" height="8" rx="4" fill="#c9ced3"/>
    <rect x="80" y="65"  width="52" height="8" rx="4" fill="#c9ced3"/>
    <rect x="80" y="82"  width="36" height="8" rx="4" fill="#c9ced3"/>
    <!-- lower full-width lines -->
    <rect x="18" y="104" width="114" height="8" rx="4" fill="#dfe3e7"/>
    <rect x="18" y="121" width="88"  height="8" rx="4" fill="#dfe3e7"/>
  </g>
</svg>
